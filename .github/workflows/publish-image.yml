name: Publish container image

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish commit image
    runs-on: ubuntu-latest

    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Run this workflow from the default branch ($DEFAULT_BRANCH)."
            exit 1
          fi

      - name: Check out selected commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Define image metadata
        id: image
        run: |
          revision="$(git rev-parse HEAD)"
          if [[ "$revision" != "$GITHUB_SHA" ]]; then
            echo "::error::Checked-out revision does not match the dispatched commit."
            exit 1
          fi

          short_sha="$(git rev-parse --short=7 HEAD)"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
          # The distinct name lets Actions create a package linked to this repository.
          echo "tag=ghcr.io/guigui42/gammuwrapper-release:main-$short_sha" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.image.outputs.revision }}

      - name: Write publication summary
        env:
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "## Published image"
            echo
            echo "- Image tag: \`$IMAGE_TAG\`"
            echo "- Digest: \`$IMAGE_DIGEST\`"
            echo "- Immutable reference: \`$IMAGE_TAG@$IMAGE_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
