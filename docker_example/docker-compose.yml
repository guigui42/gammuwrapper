services:
    gammuwrapper:
        container_name: gammuwrapper
        #network_mode: host
        image: ghcr.io/guigui42/gammuwrapper:latest
        restart: always
        environment:
            GAMMUSENDTIMEOUTSECONDS: "45"
        ports:
            - 8083:8083
        devices:
            - '/dev/serial/by-id/usb-ÿÿÿÿÿÿÿÿÿÿÿÿÿÿÿÿÿÿÿ_HUAWEI_Mobile-if00-port0:/dev/ttyUSB1'
        healthcheck:
            test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8083/health"]
            interval: 30s
            timeout: 3s
            retries: 3